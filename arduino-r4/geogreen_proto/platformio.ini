; PlatformIO - GeoGreen Prototipo fisico (UNO R4 WiFi).
; Sensor HC-SR04 + semaforo de 3 LEDs + buzzer activo en protoboard.
; Flashear:  pio run -d arduino-r4/geogreen_proto -t upload
; Monitor:   pio device monitor -b 9600
[platformio]
src_dir = .

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    arduino-libraries/ArduinoGraphics@^1.1.5
